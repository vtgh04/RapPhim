# ===================================================================
# Test Configuration for JUnit Suite (In-Memory Database H2)
# Dùng với @DataJpaTest — H2 được auto-configure bởi Spring Boot Test
# ===================================================================

# JPA: Hibernate tự tạo schema từ @Entity classes (create-drop = xóa sau khi test xong)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dùng H2Dialect tường minh để tránh Hibernate tự detect sai dialect hoặc kế thừa SQLServerDialect từ application.properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Security Configurations for testing (vẫn cần nếu @SpringBootTest dùng)
jwt.secret=9a76a982ba3da908b89f81234abcd5678ef0123456789abcdef0123456789abcdef
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=86400000
