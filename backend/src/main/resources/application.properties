# ===================================================================
# Spring Boot Configuration for RapPhim Cinema Backend
# ===================================================================

# Server Connection
server.port=5001

# Database Configuration (Microsoft SQL Server)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost\\SQLEXPRESS:1433;databaseName=RapPhim;encrypt=false;trustServerCertificate=true;}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
# Set to 'none' to protect original SQL Server tables from being altered
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Logging Level settings
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.rapphim=DEBUG

# JWT Security Configurations
jwt.secret=${JWT_SECRET:9a76a982ba3da908b89f81234abcd5678ef0123456789abcdef0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS Allowed Origins (Comma-separated list, overridable by environment variable APP_CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
