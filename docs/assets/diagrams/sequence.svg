<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Actor/Participant Gradients -->
    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4938ca" />
    </linearGradient>

    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="wsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Marker definition for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e2e8f0" />
    </marker>
    <marker id="arrowWS" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="3" fill="#e2e8f0" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" rx="12" fill="url(#bgGrad)" />
  <rect width="1000" height="700" rx="12" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Diagram Title -->
  <text x="500" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    SƠ ĐỒ TRÌNH TỰ (SEQUENCE DIAGRAM) - ĐẶT VÉ &amp; THANH TOÁN
  </text>
  <line x1="400" y1="55" x2="600" y2="55" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Lifelines / Participants -->
  <g id="participants" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <!-- Staff Lifeline -->
    <line x1="120" y1="120" x2="120" y2="650" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="50" y="80" width="140" height="40" rx="8" fill="url(#staffGrad)" />
    <text x="120" y="105">Staff (Nhân viên)</text>

    <!-- Frontend UI Lifeline -->
    <line x1="300" y1="120" x2="300" y2="650" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="230" y="80" width="140" height="40" rx="8" fill="url(#uiGrad)" />
    <text x="300" y="105">Frontend POS (React)</text>

    <!-- WebSocket Broker Lifeline -->
    <line x1="480" y1="120" x2="480" y2="650" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="410" y="80" width="140" height="40" rx="8" fill="url(#wsGrad)" />
    <text x="480" y="105">WS Broker (SockJS)</text>

    <!-- Backend API Lifeline -->
    <line x1="680" y1="120" x2="680" y2="650" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="610" y="80" width="140" height="40" rx="8" fill="url(#apiGrad)" />
    <text x="680" y="105">Backend (Spring Boot)</text>

    <!-- Database Lifeline -->
    <line x1="880" y1="120" x2="880" y2="650" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="810" y="80" width="140" height="40" rx="8" fill="url(#dbGrad)" />
    <text x="880" y="105">Database (MSSQL)</text>
  </g>

  <!-- Activation Bars -->
  <!-- Frontend -->
  <rect x="295" y="150" width="10" height="480" fill="#6366f1" opacity="0.8" rx="2" />
  <!-- WebSocket -->
  <rect x="475" y="240" width="10" height="80" fill="#f59e0b" opacity="0.8" rx="2" />
  <!-- Backend -->
  <rect x="675" y="160" width="10" height="70" fill="#ec4899" opacity="0.8" rx="2" />
  <rect x="675" y="380" width="10" height="210" fill="#ec4899" opacity="0.8" rx="2" />
  <!-- Database -->
  <rect x="875" y="180" width="10" height="40" fill="#10b981" opacity="0.8" rx="2" />
  <rect x="875" y="420" width="10" height="70" fill="#10b981" opacity="0.8" rx="2" />

  <!-- MESSAGES -->
  <g font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">
    <!-- Step 1: Open Seating Map -->
    <path d="M 120,150 L 295,150" fill="none" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="207" y="142" text-anchor="middle">1. Mở màn hình Chọn Ghế</text>

    <!-- Step 2: Fetch showtime & seats -->
    <path d="M 305,165 L 675,165" fill="none" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="490" y="158" text-anchor="middle">2. GET /api/showtimes/{id}/seats</text>

    <!-- Step 3: DB Query -->
    <path d="M 685,180 L 875,180" fill="none" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="780" y="173" text-anchor="middle">3. Truy vấn trạng thái ghế</text>

    <!-- Step 4: DB Return -->
    <path d="M 875,205 L 685,205" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
    <text x="780" y="198" text-anchor="middle">4. Trả về ds ghế và giá</text>

    <!-- Step 5: API Return -->
    <path d="M 675,220 L 305,220" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
    <text x="490" y="213" text-anchor="middle">5. Trả về JSON ds ghế</text>

    <!-- Step 6: Select Seat (Realtime Broadcast) -->
    <path d="M 120,250 L 295,250" fill="none" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="207" y="242" text-anchor="middle">6. Click chọn Ghế (ví dụ: A5)</text>

    <!-- Step 7: WS Publish -->
    <path d="M 305,265 L 475,265" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowWS)" />
    <text x="390" y="258" fill="#f59e0b" text-anchor="middle">7. Publish: A5 (LOCKED)</text>

    <!-- Step 8: WS Broadcast to other clients -->
    <path d="M 485,290 C 530,290 530,310 485,310" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowWS)" />
    <text x="560" y="305" fill="#f59e0b" text-anchor="start">8. Broadcast status cập nhật<br/>tới toàn bộ Client đang kết nối</text>

    <!-- Step 9: Click Checkout -->
    <path d="M 120,365 L 295,365" fill="none" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="207" y="357" text-anchor="middle">9. Xác nhận &amp; Nhấp Thanh Toán</text>

    <!-- Step 10: POS Checkout HTTP POST -->
    <path d="M 305,385 L 675,385" fill="none" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="490" y="377" text-anchor="middle">10. POST /api/booking/checkout (payload)</text>

    <!-- Step 11: Transaction & Validation -->
    <path d="M 685,400 C 730,400 730,415 685,415" fill="none" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="735" y="412" fill="#ec4899" text-anchor="start">11. Kiểm tra trạng thái<br/>ghế còn trống? (AVAILABLE)</text>

    <!-- Step 12: DB Update & Commit -->
    <path d="M 685,435 L 875,435" fill="none" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="780" y="427" text-anchor="middle">12. Cập nhật status ghế = BOOKED</text>

    <path d="M 685,465 L 875,465" fill="none" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="780" y="457" text-anchor="middle">13. Insert INVOICE &amp; TICKETS</text>

    <!-- Step 14: Return Commit status -->
    <path d="M 875,485 L 685,485" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
    <text x="780" y="478" text-anchor="middle">14. Xác nhận lưu dữ liệu thành công</text>

    <!-- Step 15: Generate PDF Invoices/Tickets -->
    <path d="M 685,505 C 740,505 740,520 685,520" fill="none" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="738" y="515" fill="#ec4899" text-anchor="start">15. Tạo file hóa đơn PDF<br/>&amp; vé kèm Barcode</text>

    <!-- Step 16: Publish SeatBookedEvent -->
    <path d="M 675,540 L 485,540" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowWS)" />
    <text x="580" y="533" fill="#f59e0b" text-anchor="middle">16. Event: A5 (BOOKED)</text>

    <!-- Step 17: WS Broadcast Booked Status -->
    <path d="M 480,565 C 440,565 440,590 480,590" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowWS)" />
    <text x="350" y="580" fill="#f59e0b" text-anchor="middle">17. Broadcast A5 = BOOKED</text>

    <!-- Step 18: HTTP Success response -->
    <path d="M 675,610 L 305,610" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
    <text x="490" y="602" text-anchor="middle">18. Trả về Invoice JSON (Success)</text>

    <!-- Step 19: Display Print dialog & Success state -->
    <path d="M 295,630 L 120,630" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
    <text x="207" y="622" text-anchor="middle">19. Hiển thị Popup in hóa đơn &amp; vé</text>
  </g>

</svg>
