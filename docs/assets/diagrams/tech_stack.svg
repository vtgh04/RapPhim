<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardFE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#0f1e36"/>
    </linearGradient>
    <linearGradient id="cardBE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2018"/>
      <stop offset="100%" stop-color="#0d1f16"/>
    </linearGradient>
    <linearGradient id="cardDB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a0a"/>
      <stop offset="100%" stop-color="#1c1015"/>
    </linearGradient>
    <linearGradient id="cardWS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1000"/>
      <stop offset="100%" stop-color="#1c1400"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="960" height="420" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="480" y="46" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="3">SYSTEM SPECIFICATION</text>
  <text x="480" y="76" font-family="'Segoe UI',Roboto,sans-serif" font-size="26" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TECHNOLOGY STACK</text>
  <rect x="400" y="84" width="160" height="3" rx="2" fill="#38bdf8"/>

  <!-- ── CARD 1: FRONTEND ── -->
  <g transform="translate(30,110)" filter="url(#glow)">
    <rect width="210" height="265" rx="16" fill="url(#cardFE)" stroke="#1e40af" stroke-width="1.5"/>
    <!-- accent bar -->
    <rect x="0" y="0" width="210" height="46" rx="16" fill="#1e40af" fill-opacity="0.4"/>
    <rect x="0" y="30" width="210" height="16" fill="#1e40af" fill-opacity="0.4"/>
    <text x="105" y="30" font-family="'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="800" fill="#61dafb" text-anchor="middle" letter-spacing="1">FRONTEND CLIENT</text>

    <g font-family="'Segoe UI',Roboto,sans-serif" font-size="12" fill="#cbd5e1">
      <circle cx="22" cy="70" r="4" fill="#61dafb"/>
      <text x="34" y="74">React 19 (SPA)</text>
      <circle cx="22" cy="102" r="4" fill="#646cff"/>
      <text x="34" y="106">Vite 6 (Build Tool)</text>
      <circle cx="22" cy="134" r="4" fill="#38bdf8"/>
      <text x="34" y="138">Tailwind CSS 4.0</text>
      <circle cx="22" cy="166" r="4" fill="#a78bfa"/>
      <text x="34" y="170">Zustand (Global State)</text>
      <circle cx="22" cy="198" r="4" fill="#34d399"/>
      <text x="34" y="202">React Query v5</text>
      <circle cx="22" cy="230" r="4" fill="#fb923c"/>
      <text x="34" y="234">Framer Motion</text>
    </g>
  </g>

  <!-- ── CARD 2: BACKEND ── -->
  <g transform="translate(260,110)" filter="url(#glow)">
    <rect width="210" height="265" rx="16" fill="url(#cardBE)" stroke="#166534" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="46" rx="16" fill="#166534" fill-opacity="0.4"/>
    <rect x="0" y="30" width="210" height="16" fill="#166534" fill-opacity="0.4"/>
    <text x="105" y="30" font-family="'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="800" fill="#6db33f" text-anchor="middle" letter-spacing="1">BACKEND REST API</text>

    <g font-family="'Segoe UI',Roboto,sans-serif" font-size="12" fill="#cbd5e1">
      <circle cx="22" cy="70" r="4" fill="#6db33f"/>
      <text x="34" y="74">Spring Boot 3.2.5</text>
      <circle cx="22" cy="102" r="4" fill="#f43f5e"/>
      <text x="34" y="106">Spring Security (JWT)</text>
      <circle cx="22" cy="134" r="4" fill="#6366f1"/>
      <text x="34" y="138">Spring Data JPA / Hibernate</text>
      <circle cx="22" cy="166" r="4" fill="#38bdf8"/>
      <text x="34" y="170">Spring WebSocket (STOMP)</text>
      <circle cx="22" cy="198" r="4" fill="#a78bfa"/>
      <text x="34" y="202">iText PDF + Apache POI</text>
      <circle cx="22" cy="230" r="4" fill="#fb923c"/>
      <text x="34" y="234">Lombok + Validation</text>
    </g>
  </g>

  <!-- ── CARD 3: DATABASE ── -->
  <g transform="translate(490,110)" filter="url(#glow)">
    <rect width="210" height="265" rx="16" fill="url(#cardDB)" stroke="#991b1b" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="46" rx="16" fill="#991b1b" fill-opacity="0.4"/>
    <rect x="0" y="30" width="210" height="16" fill="#991b1b" fill-opacity="0.4"/>
    <text x="105" y="30" font-family="'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="800" fill="#f87171" text-anchor="middle" letter-spacing="1">DATABASE &amp; UTILS</text>

    <g font-family="'Segoe UI',Roboto,sans-serif" font-size="12" fill="#cbd5e1">
      <circle cx="22" cy="70" r="4" fill="#cc2927"/>
      <text x="34" y="74">MS SQL Server 2019+</text>
      <circle cx="22" cy="102" r="4" fill="#38bdf8"/>
      <text x="34" y="106">HikariCP (Connection Pool)</text>
      <circle cx="22" cy="134" r="4" fill="#a78bfa"/>
      <text x="34" y="138">Hibernate ORM (3NF)</text>
      <circle cx="22" cy="166" r="4" fill="#34d399"/>
      <text x="34" y="170">MSSQL JDBC Driver</text>
      <circle cx="22" cy="198" r="4" fill="#fb923c"/>
      <text x="34" y="202">Maven Build System</text>
      <circle cx="22" cy="230" r="4" fill="#f59e0b"/>
      <text x="34" y="234">Springdoc OpenAPI (Swagger)</text>
    </g>
  </g>

  <!-- ── CARD 4: WEBSOCKET / REALTIME ── -->
  <g transform="translate(720,110)" filter="url(#glow)">
    <rect width="210" height="265" rx="16" fill="url(#cardWS)" stroke="#92400e" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="46" rx="16" fill="#92400e" fill-opacity="0.4"/>
    <rect x="0" y="30" width="210" height="16" fill="#92400e" fill-opacity="0.4"/>
    <text x="105" y="30" font-family="'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">REALTIME ENGINE</text>

    <g font-family="'Segoe UI',Roboto,sans-serif" font-size="12" fill="#cbd5e1">
      <circle cx="22" cy="70" r="4" fill="#f59e0b"/>
      <text x="34" y="74">WebSocket / STOMP</text>
      <circle cx="22" cy="102" r="4" fill="#fb923c"/>
      <text x="34" y="106">SockJS (Fallback)</text>
      <circle cx="22" cy="134" r="4" fill="#34d399"/>
      <text x="34" y="138">@stomp/stompjs Client</text>
      <circle cx="22" cy="166" r="4" fill="#38bdf8"/>
      <text x="34" y="170">In-Memory Simple Broker</text>
      <circle cx="22" cy="198" r="4" fill="#a78bfa"/>
      <text x="34" y="202">Live Seat Status Sync</text>
      <circle cx="22" cy="230" r="4" fill="#6db33f"/>
      <text x="34" y="234">ApplicationEventPublisher</text>
    </g>
  </g>

  <!-- Footer tag -->
  <text x="480" y="400" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" fill="#334155" text-anchor="middle">Java 17 + Node 18 + Microsoft SQL Server 2019 — RapPhim v1.0.0</text>
</svg>
