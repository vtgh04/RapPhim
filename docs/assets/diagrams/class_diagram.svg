<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Class Header Gradient -->
    <linearGradient id="clsHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Filter Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow markers for associations -->
    <marker id="diamond" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 5 L 5 2 L 10 5 L 5 8 Z" fill="#6366f1" />
    </marker>
    <marker id="navArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="#64748b" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="800" rx="12" fill="url(#bgGrad)" />
  <rect width="1100" height="800" rx="12" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Diagram Title -->
  <text x="550" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    SƠ ĐỒ LỚP THỰC THỂ (DOMAIN CLASS DIAGRAM)
  </text>
  <line x1="430" y1="55" x2="670" y2="55" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- CLASSES DEFINITION -->

  <!-- CLASS 1: Employee -->
  <g transform="translate(40, 100)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="190" height="150" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 4 C 0 0, 190 0, 190 4 L 190 28 L 0 28 Z" fill="url(#clsHeader)" />
    <text x="15" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Employee</text>
    
    <text x="10" y="45">- employeeId: String</text>
    <text x="10" y="60">- fullName: String</text>
    <text x="10" y="75">- username: String</text>
    <text x="10" y="90">- password: String</text>
    <text x="10" y="105">- role: EmployeeRole</text>
    <text x="10" y="120">- status: EmployeeStatus</text>
    <line x1="0" y1="128" x2="190" y2="128" stroke="#475569" stroke-width="1" />
    <text x="10" y="142">+ getters &amp; setters()</text>
  </g>

  <!-- CLASS 2: Movie -->
  <g transform="translate(450, 80)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="190" height="180" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 4 C 0 0, 190 0, 190 4 L 190 28 L 0 28 Z" fill="url(#clsHeader)" />
    <text x="15" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Movie</text>

    <text x="10" y="45">- movieId: String</text>
    <text x="10" y="60">- title: String</text>
    <text x="10" y="75">- genre: String</text>
    <text x="10" y="90">- durationMins: int</text>
    <text x="10" y="105">- formatMovie: String</text>
    <text x="10" y="120">- rating: String</text>
    <text x="10" y="135">- releaseDate: LocalDate</text>
    <text x="10" y="150">- status: MovieStatus</text>
    <line x1="0" y1="158" x2="190" y2="158" stroke="#475569" stroke-width="1" />
    <text x="10" y="172">+ getters &amp; setters()</text>
  </g>

  <!-- CLASS 3: Review -->
  <g transform="translate(850, 100)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="190" height="135" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 4 C 0 0, 190 0, 190 4 L 190 28 L 0 28 Z" fill="url(#clsHeader)" />
    <text x="15" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Review</text>

    <text x="10" y="45">- reviewId: String</text>
    <text x="10" y="60">- movieId: String</text>
    <text x="10" y="75">- userId: String</text>
    <text x="10" y="90">- rating: int</text>
    <text x="10" y="105">- comment: String</text>
    <line x1="0" y1="113" x2="190" y2="113" stroke="#475569" stroke-width="1" />
    <text x="10" y="127">+ getters &amp; setters()</text>
  </g>

  <!-- CLASS 4: CinemaHall -->
  <g transform="translate(40, 310)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="190" height="135" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 4 C 0 0, 190 0, 190 4 L 190 28 L 0 28 Z" fill="url(#clsHeader)" />
    <text x="15" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">CinemaHall</text>

    <text x="10" y="45">- hallId: String</text>
    <text x="10" y="60">- name: String</text>
    <text x="10" y="75">- hallType: String</text>
    <text x="10" y="90">- totalRows: int</text>
    <text x="10" y="105">- totalCols: int</text>
    <line x1="0" y1="113" x2="190" y2="113" stroke="#475569" stroke-width="1" />
    <text x="10" y="127">+ getters &amp; setters()</text>
  </g>

  <!-- CLASS 5: Seat -->
  <g transform="translate(40, 520)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="190" height="150" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 4 C 0 0, 190 0, 190 4 L 190 28 L 0 28 Z" fill="url(#clsHeader)" />
    <text x="15" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Seat</text>

    <text x="10" y="45">- seatId: String</text>
    <text x="10" y="60">- hallId: String</text>
    <text x="10" y="75">- rowChar: char</text>
    <text x="10" y="90">- colNumber: int</text>
    <text x="10" y="105">- seatType: SeatType</text>
    <text x="10" y="120">- isBroken: boolean</text>
    <line x1="0" y1="128" x2="190" y2="128" stroke="#475569" stroke-width="1" />
    <text x="10" y="142">+ getters &amp; setters()</text>
  </g>

  <!-- CLASS 6: Showtime -->
  <g transform="translate(450, 340)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="190" height="150" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 4 C 0 0, 190 0, 190 4 L 190 28 L 0 28 Z" fill="url(#clsHeader)" />
    <text x="15" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Showtime</text>

    <text x="10" y="45">- showtimeId: String</text>
    <text x="10" y="60">- movieId: String</text>
    <text x="10" y="75">- hallId: String</text>
    <text x="10" y="90">- startTime: LocalDateTime</text>
    <text x="10" y="105">- endTime: LocalDateTime</text>
    <text x="10" y="120">- basePrice: double</text>
    <line x1="0" y1="128" x2="190" y2="128" stroke="#475569" stroke-width="1" />
    <text x="10" y="142">+ getters &amp; setters()</text>
  </g>

  <!-- CLASS 7: ShowSeat -->
  <g transform="translate(450, 560)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="190" height="135" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 4 C 0 0, 190 0, 190 4 L 190 28 L 0 28 Z" fill="url(#clsHeader)" />
    <text x="15" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">ShowSeat</text>

    <text x="10" y="45">- showSeatId: String</text>
    <text x="10" y="60">- showtimeId: String</text>
    <text x="10" y="75">- seatId: String</text>
    <text x="10" y="90">- price: double</text>
    <text x="10" y="105">- status: ShowSeatStatus</text>
    <line x1="0" y1="113" x2="190" y2="113" stroke="#475569" stroke-width="1" />
    <text x="10" y="127">+ getters &amp; setters()</text>
  </g>

  <!-- CLASS 8: Invoice -->
  <g transform="translate(850, 280)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="190" height="150" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 4 C 0 0, 190 0, 190 4 L 190 28 L 0 28 Z" fill="url(#clsHeader)" />
    <text x="15" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Invoice</text>

    <text x="10" y="45">- invoiceId: String</text>
    <text x="10" y="60">- employeeId: String</text>
    <text x="10" y="75">- createdAt: LocalDateTime</text>
    <text x="10" y="90">- totalAmount: double</text>
    <text x="10" y="105">- totalTickets: int</text>
    <text x="10" y="120">- paymentMethod: Payment</text>
    <line x1="0" y1="128" x2="190" y2="128" stroke="#475569" stroke-width="1" />
    <text x="10" y="142">+ getters &amp; setters()</text>
  </g>

  <!-- CLASS 9: Ticket -->
  <g transform="translate(850, 520)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="190" height="150" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <path d="M 0 4 C 0 0, 190 0, 190 4 L 190 28 L 0 28 Z" fill="url(#clsHeader)" />
    <text x="15" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Ticket</text>

    <text x="10" y="45">- ticketId: String</text>
    <text x="10" y="60">- invoiceId: String</text>
    <text x="10" y="75">- showSeatId: String</text>
    <text x="10" y="90">- originalPrice: double</text>
    <text x="10" y="105">- priceAfterDiscount: double</text>
    <text x="10" y="120">- barcode: String</text>
    <line x1="0" y1="128" x2="190" y2="128" stroke="#475569" stroke-width="1" />
    <text x="10" y="142">+ getters &amp; setters()</text>
  </g>

  <!-- CLASS CONNECTIONS (ASSOCIATIONS) -->

  <!-- Employee - Invoice (1 to many association represented as dashed line with navigator arrow) -->
  <path d="M 230,175 C 330,175 800,200 850,320" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#navArrow)" />
  <text x="250" y="170" fill="#94a3b8" font-size="10">1</text>
  <text x="835" y="310" fill="#94a3b8" font-size="10">*</text>

  <!-- Movie - Review (1 to many) -->
  <path d="M 640,140 L 850,140" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#navArrow)" />
  <text x="650" y="135" fill="#94a3b8" font-size="10">1</text>
  <text x="835" y="135" fill="#94a3b8" font-size="10">*</text>

  <!-- Movie - Showtime (1 to many) -->
  <path d="M 545,260 L 545,340" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#navArrow)" />
  <text x="535" y="275" fill="#94a3b8" font-size="10">1</text>
  <text x="535" y="330" fill="#94a3b8" font-size="10">*</text>

  <!-- CinemaHall - Seat (1 to many) -->
  <path d="M 135,445 L 135,520" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#navArrow)" />
  <text x="125" y="460" fill="#94a3b8" font-size="10">1</text>
  <text x="125" y="510" fill="#94a3b8" font-size="10">*</text>

  <!-- CinemaHall - Showtime (1 to many) -->
  <path d="M 230,370 L 450,400" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#navArrow)" />
  <text x="245" y="365" fill="#94a3b8" font-size="10">1</text>
  <text x="435" y="390" fill="#94a3b8" font-size="10">*</text>

  <!-- Showtime - ShowSeat (1 to many) -->
  <path d="M 640,415 C 720,415 720,580 640,580" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#navArrow)" />
  <text x="645" y="430" fill="#94a3b8" font-size="10">1</text>
  <text x="645" y="570" fill="#94a3b8" font-size="10">*</text>

  <!-- Seat - ShowSeat (1 to many) -->
  <path d="M 230,580 C 330,580 340,610 450,610" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#navArrow)" />
  <text x="245" y="575" fill="#94a3b8" font-size="10">1</text>
  <text x="435" y="605" fill="#94a3b8" font-size="10">*</text>

  <!-- Invoice - Ticket (1 to many) -->
  <path d="M 945,430 L 945,520" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#navArrow)" />
  <text x="935" y="445" fill="#94a3b8" font-size="10">1</text>
  <text x="935" y="510" fill="#94a3b8" font-size="10">*</text>

  <!-- ShowSeat - Ticket (1 to 1) -->
  <path d="M 640,620 C 740,620 770,580 850,565" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#navArrow)" />
  <text x="650" y="615" fill="#94a3b8" font-size="10">1</text>
  <text x="835" y="555" fill="#94a3b8" font-size="10">1</text>

</svg>
