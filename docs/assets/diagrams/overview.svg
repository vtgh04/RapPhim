<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Layers gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="securityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="wsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filter Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Marker definition for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowWS" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" rx="12" fill="url(#bgGrad)" />
  <rect width="1000" height="650" rx="12" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Diagram Title -->
  <text x="500" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    SƠ ĐỒ TỔNG QUAN KIẾN TRÚC HỆ THỐNG
  </text>
  <line x1="420" y1="55" x2="580" y2="55" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- LAYER 1: CLIENT LAYER (React SPA) -->
  <g transform="translate(50, 90)" filter="url(#shadow)">
    <rect width="220" height="490" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect width="220" height="40" rx="10" fill="url(#clientGrad)" />
    <text x="110" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">CLIENT LAYER (React SPA)</text>

    <!-- Component Blocks -->
    <g transform="translate(15, 60)">
      <rect width="190" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">React Features / Components</text>
      <text x="95" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Booking POS, Dashboard, Admin</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="190" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">State Management</text>
      <text x="95" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Zustand, React Query</text>
    </g>

    <g transform="translate(15, 220)">
      <rect width="190" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Styling &amp; Theme</text>
      <text x="95" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Vanilla CSS, Framer Motion</text>
    </g>

    <g transform="translate(15, 300)">
      <rect width="190" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Axios Services</text>
      <text x="95" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Request/Response Interceptors</text>
      <text x="95" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8" font-weight="600" text-anchor="middle">Attach JWT Bearer token</text>
    </g>

    <g transform="translate(15, 395)">
      <rect width="190" height="75" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
      <text x="95" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">WebSocket Client</text>
      <text x="95" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">STOMP Over SockJS</text>
      <text x="95" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d97706" font-style="italic" text-anchor="middle">Realtime Seat Reservations</text>
    </g>
  </g>

  <!-- LAYER 2: SECURITY & ROUTING LAYER -->
  <g transform="translate(340, 200)" filter="url(#shadow)">
    <rect width="140" height="270" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="2" />
    <rect width="140" height="40" rx="10" fill="url(#securityGrad)" />
    <text x="70" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">SECURITY LAYER</text>

    <!-- Components -->
    <g transform="translate(10, 60)">
      <rect width="120" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="60" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">CORS Configuration</text>
      <text x="60" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Allow authorized origins</text>
    </g>

    <g transform="translate(10, 125)">
      <rect width="120" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="60" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">JWT Request Filter</text>
      <text x="60" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Extract &amp; validate token</text>
      <text x="60" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f43f5e" font-weight="600" text-anchor="middle">Spring Security Auth</text>
    </g>

    <g transform="translate(10, 200)">
      <rect width="120" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="60" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">RBAC Rules</text>
      <text x="60" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Manager/Staff roles</text>
    </g>
  </g>

  <!-- LAYER 3: CORE BACKEND LAYER (Spring Boot REST API) -->
  <g transform="translate(540, 90)" filter="url(#shadow)">
    <rect width="220" height="490" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <rect width="220" height="40" rx="10" fill="url(#backendGrad)" />
    <text x="110" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BACKEND (Spring Boot REST)</text>

    <!-- Component Blocks -->
    <g transform="translate(15, 60)">
      <rect width="190" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">REST Controllers</text>
      <text x="95" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Auth, Movie, Showtime, Booking API</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="190" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Transactional Services</text>
      <text x="95" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Core Business logic &amp; validations</text>
      <text x="95" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#6366f1" font-weight="600" text-anchor="middle">@Transactional boundaries</text>
    </g>

    <g transform="translate(15, 230)">
      <rect width="190" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Spring Data JPA Repos</text>
      <text x="95" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Database Query Abstraction (Hibernate)</text>
    </g>

    <g transform="translate(15, 310)">
      <rect width="190" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Export &amp; PDF Generators</text>
      <text x="95" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Apache POI Excel, iText Invoice PDF</text>
    </g>

    <g transform="translate(15, 395)">
      <rect width="190" height="75" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
      <text x="95" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">WebSocket STOMP Broker</text>
      <text x="95" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Message Channel (/topic/showtime)</text>
      <text x="95" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d97706" font-style="italic" text-anchor="middle">In-memory Simple Broker</text>
    </g>
  </g>

  <!-- LAYER 4: DATABASE LAYER -->
  <g transform="translate(820, 200)" filter="url(#shadow)">
    <rect width="130" height="270" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect width="130" height="40" rx="10" fill="url(#dbGrad)" />
    <text x="65" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">DATA LAYER</text>

    <!-- Cylinder DB shape -->
    <g transform="translate(25, 80)">
      <path d="M 0 15 C 0 0, 80 0, 80 15 L 80 75 C 80 90, 0 90, 0 75 Z" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <ellipse cx="40" cy="15" rx="40" ry="10" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
      <ellipse cx="40" cy="35" rx="40" ry="10" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" />
      <ellipse cx="40" cy="55" rx="40" ry="10" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="40" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">MS SQL Server</text>
      <text x="40" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Cinema DB</text>
    </g>
  </g>

  <!-- FLOW LINES (HTTP REST) -->
  <!-- Client to Security -->
  <path d="M 270,335 L 330,335" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="300" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" font-weight="bold" text-anchor="middle">HTTPS</text>

  <!-- Security to Backend Controllers -->
  <path d="M 480,335 L 530,335" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Backend to DB -->
  <path d="M 760,335 L 810,335" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="785" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" font-weight="bold" text-anchor="middle">JPA</text>

  <!-- WEBSOCKET REALTIME FLOW (WebSocket Bypass Security) -->
  <path d="M 270,520 C 370,550 430,550 530,520" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowWS)" marker-start="url(#arrowWS)" />
  <text x="400" y="555" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f59e0b" font-weight="bold" text-anchor="middle">WebSocket / STOMP (Realtime Seats)</text>

</svg>
