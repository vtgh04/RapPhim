<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Actor Gradient -->
    <linearGradient id="actorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Use Case Gradients -->
    <linearGradient id="ucManagerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="ucStaffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="ucCommonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" rx="12" fill="url(#bgGrad)" />
  <rect width="900" height="650" rx="12" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Diagram Title -->
  <text x="450" y="45" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    SƠ ĐỒ USE CASE - HỆ THỐNG RAPPHIM
  </text>
  <line x1="380" y1="55" x2="520" y2="55" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- System Boundary -->
  <rect x="220" y="80" width="460" height="530" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.5" />
  <text x="235" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" letter-spacing="0.5">
    HỆ THỐNG QUẢN LÝ &amp; POS RAPPHIM
  </text>

  <!-- ACTOR: MANAGER (Left) -->
  <g transform="translate(100, 200)" filter="url(#shadow)">
    <!-- Head -->
    <circle cx="0" cy="-30" r="18" fill="url(#actorGrad)" />
    <!-- Body -->
    <path d="M-22,15 C-22,-10 22,-10 22,15 Z" fill="url(#actorGrad)" />
    <!-- Arms -->
    <line x1="-20" y1="2" x2="-35" y2="25" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="2" x2="35" y2="25" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <!-- Legs -->
    <line x1="-8" y1="15" x2="-12" y2="45" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <line x1="8" y1="15" x2="12" y2="45" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <!-- Label -->
    <text x="0" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">MANAGER</text>
    <text x="0" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">(Quản lý)</text>
  </g>

  <!-- ACTOR: STAFF (Right) -->
  <g transform="translate(800, 280)" filter="url(#shadow)">
    <!-- Head -->
    <circle cx="0" cy="-30" r="18" fill="url(#actorGrad)" />
    <!-- Body -->
    <path d="M-22,15 C-22,-10 22,-10 22,15 Z" fill="url(#actorGrad)" />
    <!-- Arms -->
    <line x1="-20" y1="2" x2="-35" y2="25" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="2" x2="35" y2="25" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <!-- Legs -->
    <line x1="-8" y1="15" x2="-12" y2="45" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <line x1="8" y1="15" x2="12" y2="45" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />
    <!-- Label -->
    <text x="0" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">STAFF</text>
    <text x="0" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">(Nhân viên bán vé)</text>
  </g>

  <!-- USE CASES -->

  <!-- Manager Use Cases -->
  <g filter="url(#shadow)" id="uc-m1">
    <rect x="250" y="130" width="180" height="45" rx="20" fill="url(#ucManagerGrad)" stroke="#f43f5e" stroke-width="1" />
    <text x="340" y="157" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Quản lý Phim</text>
  </g>
  <g filter="url(#shadow)" id="uc-m2">
    <rect x="250" y="195" width="180" height="45" rx="20" fill="url(#ucManagerGrad)" stroke="#f43f5e" stroke-width="1" />
    <text x="340" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Quản lý Suất chiếu</text>
  </g>
  <g filter="url(#shadow)" id="uc-m3">
    <rect x="250" y="260" width="180" height="45" rx="20" fill="url(#ucManagerGrad)" stroke="#f43f5e" stroke-width="1" />
    <text x="340" y="287" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Quản lý Phòng chiếu</text>
  </g>
  <g filter="url(#shadow)" id="uc-m4">
    <rect x="250" y="325" width="180" height="45" rx="20" fill="url(#ucManagerGrad)" stroke="#f43f5e" stroke-width="1" />
    <text x="340" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Xem Doanh thu &amp; Báo cáo</text>
  </g>

  <!-- Common Use Cases -->
  <g filter="url(#shadow)" id="uc-c1">
    <rect x="360" y="400" width="180" height="45" rx="20" fill="url(#ucCommonGrad)" stroke="#6366f1" stroke-width="1" />
    <text x="450" y="427" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Đăng nhập hệ thống</text>
  </g>

  <!-- Staff Use Cases -->
  <g filter="url(#shadow)" id="uc-s1">
    <rect x="470" y="130" width="180" height="45" rx="20" fill="url(#ucStaffGrad)" stroke="#10b981" stroke-width="1" />
    <text x="560" y="157" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Bán vé &amp; Đặt chỗ (POS)</text>
  </g>
  <g filter="url(#shadow)" id="uc-s2">
    <rect x="470" y="195" width="180" height="45" rx="20" fill="url(#ucStaffGrad)" stroke="#10b981" stroke-width="1" />
    <text x="560" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Xem Sơ đồ ghế Realtime</text>
  </g>
  <g filter="url(#shadow)" id="uc-s3">
    <rect x="470" y="260" width="180" height="45" rx="20" fill="url(#ucStaffGrad)" stroke="#10b981" stroke-width="1" />
    <text x="560" y="287" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Áp dụng Mã giảm giá</text>
  </g>
  <g filter="url(#shadow)" id="uc-s4">
    <rect x="470" y="325" width="180" height="45" rx="20" fill="url(#ucStaffGrad)" stroke="#10b981" stroke-width="1" />
    <text x="560" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Xuất hóa đơn &amp; Vé PDF</text>
  </g>

  <!-- Extends / Includes nested relationship inside System Boundary -->
  <g filter="url(#shadow)" id="uc-sub1">
    <rect x="360" y="520" width="180" height="40" rx="10" fill="#334155" stroke="#475569" stroke-width="1" />
    <text x="450" y="545" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#e2e8f0" text-anchor="middle">Quét mã Barcode kiểm vé</text>
  </g>

  <!-- CONNECTIONS -->

  <!-- Manager Links -->
  <!-- Line color is slate-400, styling with smooth marker arrows or simple stroke -->
  <line x1="135" y1="210" x2="250" y2="152" stroke="#64748b" stroke-width="1.5" />
  <line x1="135" y1="210" x2="250" y2="217" stroke="#64748b" stroke-width="1.5" />
  <line x1="135" y1="210" x2="250" y2="282" stroke="#64748b" stroke-width="1.5" />
  <line x1="135" y1="210" x2="250" y2="347" stroke="#64748b" stroke-width="1.5" />
  <line x1="135" y1="210" x2="360" y2="422" stroke="#64748b" stroke-width="1.5" />

  <!-- Staff Links -->
  <line x1="765" y1="290" x2="650" y2="152" stroke="#64748b" stroke-width="1.5" />
  <line x1="765" y1="290" x2="650" y2="217" stroke="#64748b" stroke-width="1.5" />
  <line x1="765" y1="290" x2="650" y2="282" stroke="#64748b" stroke-width="1.5" />
  <line x1="765" y1="290" x2="650" y2="347" stroke="#64748b" stroke-width="1.5" />
  <line x1="765" y1="290" x2="540" y2="422" stroke="#64748b" stroke-width="1.5" />

  <!-- Extends relationship -->
  <path d="M 560,370 C 560,450 540,490 490,520" fill="none" stroke="#38bdf8" stroke-dasharray="5,5" stroke-width="1.5" />
  <!-- Arrow marker manually drawn -->
  <polygon points="490,520 498,514 493,510" fill="#38bdf8" />
  <text x="565" y="470" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" font-style="italic" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

</svg>
