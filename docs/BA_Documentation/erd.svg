<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Table Header Gradients -->
    <linearGradient id="tblHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Filter Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="800" rx="12" fill="url(#bgGrad)" />
  <rect width="1100" height="800" rx="12" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Diagram Title -->
  <text x="550" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    SƠ ĐỒ QUAN HỆ THỰC THỂ (DATABASE ERD)
  </text>
  <line x1="450" y1="55" x2="650" y2="55" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- TABLES DEFINITION -->

  <!-- TABLE 1: employees (Left Top) -->
  <g transform="translate(40, 100)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="200" height="170" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 6 C 0 0, 200 0, 200 6 L 200 28 L 0 28 Z" fill="url(#tblHeader)" />
    <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">employees</text>
    
    <text x="10" y="45" fill="#f43f5e" font-weight="bold">🔑 employee_id [PK]</text>
    <text x="10" y="60">   full_name: NVARCHAR(100)</text>
    <text x="10" y="75">   username: VARCHAR(50)</text>
    <text x="10" y="90">   password: VARCHAR(255)</text>
    <text x="10" y="105">   role: VARCHAR(20)</text>
    <text x="10" y="120">   status: VARCHAR(20)</text>
    <text x="10" y="135">   phone: VARCHAR(20)</text>
    <text x="10" y="150">   email: VARCHAR(100)</text>
  </g>

  <!-- TABLE 2: movies (Middle Top) -->
  <g transform="translate(450, 80)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="200" height="210" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 6 C 0 0, 200 0, 200 6 L 200 28 L 0 28 Z" fill="url(#tblHeader)" />
    <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">movies</text>

    <text x="10" y="45" fill="#f43f5e" font-weight="bold">🔑 movie_id [PK]</text>
    <text x="10" y="60">   title: NVARCHAR(200)</text>
    <text x="10" y="75">   genre: NVARCHAR(100)</text>
    <text x="10" y="90">   duration_mins: INT</text>
    <text x="10" y="105">   format_movie: VARCHAR(20)</text>
    <text x="10" y="120">   rating: VARCHAR(10)</text>
    <text x="10" y="135">   language: NVARCHAR(50)</text>
    <text x="10" y="150">   release_date: DATE</text>
    <text x="10" y="165">   status: VARCHAR(20)</text>
    <text x="10" y="180">   description: NVARCHAR(MAX)</text>
    <text x="10" y="195">   poster_url: VARCHAR(255)</text>
  </g>

  <!-- TABLE 3: reviews (Right Top) -->
  <g transform="translate(850, 100)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="200" height="135" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 6 C 0 0, 200 0, 200 6 L 200 28 L 0 28 Z" fill="url(#tblHeader)" />
    <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">reviews</text>

    <text x="10" y="45" fill="#f43f5e" font-weight="bold">🔑 review_id [PK]</text>
    <text x="10" y="60" fill="#a855f7">🔗 movie_id [FK]</text>
    <text x="10" y="75">   user_id: NVARCHAR(100)</text>
    <text x="10" y="90">   rating: INT (1-5)</text>
    <text x="10" y="105">   comment: NVARCHAR(1000)</text>
    <text x="10" y="120">   created_at: DATETIME2</text>
  </g>

  <!-- TABLE 4: cinema_halls (Left Mid) -->
  <g transform="translate(40, 310)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="200" height="135" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 6 C 0 0, 200 0, 200 6 L 200 28 L 0 28 Z" fill="url(#tblHeader)" />
    <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">cinema_halls</text>

    <text x="10" y="45" fill="#f43f5e" font-weight="bold">🔑 hall_id [PK]</text>
    <text x="10" y="60">   name: NVARCHAR(100)</text>
    <text x="10" y="75">   hall_type: VARCHAR(20)</text>
    <text x="10" y="90">   total_rows: INT</text>
    <text x="10" y="105">   total_cols: INT</text>
    <text x="10" y="120">   status: VARCHAR(20)</text>
  </g>

  <!-- TABLE 5: seats (Left Bottom) -->
  <g transform="translate(40, 520)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="200" height="155" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 6 C 0 0, 200 0, 200 6 L 200 28 L 0 28 Z" fill="url(#tblHeader)" />
    <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">seats</text>

    <text x="10" y="45" fill="#f43f5e" font-weight="bold">🔑 seat_id [PK]</text>
    <text x="10" y="60" fill="#a855f7">🔗 hall_id [FK]</text>
    <text x="10" y="75">   row_char: CHAR(1)</text>
    <text x="10" y="90">   col_number: INT</text>
    <text x="10" y="105">   seat_type: VARCHAR(20)</text>
    <text x="10" y="120">   seat_factor: DECIMAL</text>
    <text x="10" y="135">   is_broken: BIT</text>
  </g>

  <!-- TABLE 6: showtimes (Middle Bottom) -->
  <g transform="translate(450, 360)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="200" height="155" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 6 C 0 0, 200 0, 200 6 L 200 28 L 0 28 Z" fill="url(#tblHeader)" />
    <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">showtimes</text>

    <text x="10" y="45" fill="#f43f5e" font-weight="bold">🔑 showtime_id [PK]</text>
    <text x="10" y="60" fill="#a855f7">🔗 movie_id [FK]</text>
    <text x="10" y="75" fill="#a855f7">🔗 hall_id [FK]</text>
    <text x="10" y="90">   start_time: DATETIME2</text>
    <text x="10" y="105">   end_time: DATETIME2</text>
    <text x="10" y="120">   base_price: DECIMAL</text>
    <text x="10" y="135">   status: VARCHAR(20)</text>
  </g>

  <!-- TABLE 7: show_seats (Middle Bottom-most) -->
  <g transform="translate(450, 580)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="200" height="135" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 6 C 0 0, 200 0, 200 6 L 200 28 L 0 28 Z" fill="url(#tblHeader)" />
    <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">show_seats</text>

    <text x="10" y="45" fill="#f43f5e" font-weight="bold">🔑 show_seat_id [PK]</text>
    <text x="10" y="60" fill="#a855f7">🔗 showtime_id [FK]</text>
    <text x="10" y="75" fill="#a855f7">🔗 seat_id [FK]</text>
    <text x="10" y="90">   price: DECIMAL</text>
    <text x="10" y="105">   status: VARCHAR(20)</text>
  </g>

  <!-- TABLE 8: invoices (Right Mid) -->
  <g transform="translate(850, 280)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="200" height="175" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 6 C 0 0, 200 0, 200 6 L 200 28 L 0 28 Z" fill="url(#tblHeader)" />
    <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">invoices</text>

    <text x="10" y="45" fill="#f43f5e" font-weight="bold">🔑 invoice_id [PK]</text>
    <text x="10" y="60" fill="#a855f7">🔗 employee_id [FK]</text>
    <text x="10" y="75">   created_at: DATETIME2</text>
    <text x="10" y="90">   total_amount: DECIMAL</text>
    <text x="10" y="105">   total_tickets: INT</text>
    <text x="10" y="120">   payment_method: VARCHAR(20)</text>
    <text x="10" y="135">   status: VARCHAR(20)</text>
    <text x="10" y="150">   note: NVARCHAR(1000)</text>
  </g>

  <!-- TABLE 9: tickets (Right Bottom) -->
  <g transform="translate(850, 520)" filter="url(#shadow)" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">
    <rect width="200" height="155" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 6 C 0 0, 200 0, 200 6 L 200 28 L 0 28 Z" fill="url(#tblHeader)" />
    <text x="10" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">tickets</text>

    <text x="10" y="45" fill="#f43f5e" font-weight="bold">🔑 ticket_id [PK]</text>
    <text x="10" y="60" fill="#a855f7">🔗 invoice_id [FK]</text>
    <text x="10" y="75" fill="#a855f7">🔗 show_seat_id [FK]</text>
    <text x="10" y="90">   original_price: DECIMAL</text>
    <text x="10" y="105">   price_after_discount: DECIMAL</text>
    <text x="10" y="120">   barcode: VARCHAR(100)</text>
    <text x="10" y="135">   status: VARCHAR(20)</text>
  </g>

  <!-- RELATIONSHIP LINES (Crows Foot Connector Style) -->
  <!-- employees to invoices (1 - N) -->
  <path d="M 240,185 C 340,185 800,200 850,330" fill="none" stroke="#64748b" stroke-width="1.5" />
  <circle cx="242" cy="185" r="3" fill="#64748b" />
  <line x1="845" y1="330" x2="855" y2="330" stroke="#64748b" stroke-width="3" />

  <!-- movies to showtimes (1 - N) -->
  <path d="M 550,290 L 550,360" fill="none" stroke="#64748b" stroke-width="1.5" />
  <circle cx="550" cy="292" r="3" fill="#64748b" />
  <line x1="545" y1="358" x2="555" y2="358" stroke="#64748b" stroke-width="3" />

  <!-- cinema_halls to seats (1 - N) -->
  <path d="M 140,445 L 140,520" fill="none" stroke="#64748b" stroke-width="1.5" />
  <circle cx="140" cy="447" r="3" fill="#64748b" />
  <line x1="135" y1="518" x2="145" y2="518" stroke="#64748b" stroke-width="3" />

  <!-- cinema_halls to showtimes (1 - N) -->
  <path d="M 240,380 L 450,420" fill="none" stroke="#64748b" stroke-width="1.5" />
  <circle cx="242" cy="380" r="3" fill="#64748b" />
  <line x1="445" y1="421" x2="452" y2="419" stroke="#64748b" stroke-width="3" />

  <!-- showtimes to show_seats (1 - N) -->
  <path d="M 650,440 C 720,440 720,600 650,600" fill="none" stroke="#64748b" stroke-width="1.5" />
  <circle cx="648" cy="440" r="3" fill="#64748b" />
  <line x1="648" y1="600" x2="652" y2="600" stroke="#64748b" stroke-width="3" />

  <!-- seats to show_seats (1 - N) -->
  <path d="M 240,600 C 350,600 350,630 450,630" fill="none" stroke="#64748b" stroke-width="1.5" />
  <circle cx="242" cy="600" r="3" fill="#64748b" />
  <line x1="445" y1="630" x2="452" y2="630" stroke="#64748b" stroke-width="3" />

  <!-- invoices to tickets (1 - N) -->
  <path d="M 950,455 L 950,520" fill="none" stroke="#64748b" stroke-width="1.5" />
  <circle cx="950" cy="457" r="3" fill="#64748b" />
  <line x1="945" y1="518" x2="955" y2="518" stroke="#64748b" stroke-width="3" />

  <!-- show_seats to tickets (1 - 1 / N) -->
  <path d="M 650,650 C 750,650 780,600 850,580" fill="none" stroke="#64748b" stroke-width="1.5" />
  <circle cx="652" cy="650" r="3" fill="#64748b" />
  <line x1="845" y1="581" x2="852" y2="579" stroke="#64748b" stroke-width="3" />

  <!-- movies to reviews (1 - N) -->
  <path d="M 650,140 L 850,140" fill="none" stroke="#64748b" stroke-width="1.5" />
  <circle cx="652" cy="140" r="3" fill="#64748b" />
  <line x1="845" y1="140" x2="855" y2="140" stroke="#64748b" stroke-width="3" />

</svg>
