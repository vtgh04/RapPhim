<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Arrow -->
    <marker id="arrowH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="#64748b"/>
    </marker>
    <marker id="arrowWS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1.5 L8 5 L0 8.5z" fill="#334155"/>
    </marker>
    <filter id="glow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="360" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="500" y="44" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="3">SYSTEM TOPOLOGY</text>
  <text x="500" y="72" font-family="'Segoe UI',Roboto,sans-serif" font-size="26" font-weight="900" fill="#f8fafc" text-anchor="middle">PROJECT ARCHITECTURE</text>
  <rect x="420" y="80" width="160" height="3" rx="2" fill="#38bdf8"/>

  <!-- ── LAYER LABELS ── -->
  <text x="128" y="118" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" letter-spacing="2">CLIENT</text>
  <text x="400" y="118" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" fill="#f43f5e" text-anchor="middle" letter-spacing="2">SECURITY</text>
  <text x="620" y="118" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6db33f" text-anchor="middle" letter-spacing="2">CORE SERVICES</text>
  <text x="875" y="118" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" fill="#cc2927" text-anchor="middle" letter-spacing="2">DATA</text>

  <!-- ── NODE 1: React SPA ── -->
  <g transform="translate(28,130)" filter="url(#glow)">
    <rect width="200" height="175" rx="14" fill="#0c1a2e" stroke="#1e40af" stroke-width="1.5"/>
    <rect width="200" height="40" rx="14" fill="#1e3a5f"/>
    <rect y="26" width="200" height="14" fill="#1e3a5f"/>
    <text x="100" y="26" font-family="'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="800" fill="#61dafb" text-anchor="middle">React SPA</text>
    <g font-family="'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">
      <text x="16" y="72">• Booking POS / Seat Map</text>
      <text x="16" y="95">• Dashboard &amp; Analytics</text>
      <text x="16" y="118">• Zustand + React Query</text>
      <text x="16" y="141">• Axios (JWT interceptors)</text>
      <text x="16" y="164">• STOMP WebSocket client</text>
    </g>
  </g>

  <!-- ── NODE 2: Security Filter ── -->
  <g transform="translate(270,155)" filter="url(#glow)">
    <rect width="186" height="120" rx="14" fill="#1f0918" stroke="#be185d" stroke-width="1.5"/>
    <rect width="186" height="38" rx="14" fill="#4a0d2e"/>
    <rect y="24" width="186" height="14" fill="#4a0d2e"/>
    <text x="93" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="800" fill="#f43f5e" text-anchor="middle">Spring Security</text>
    <g font-family="'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">
      <text x="14" y="64">• CORS allow-list</text>
      <text x="14" y="86">• JWT filter &amp; validation</text>
      <text x="14" y="108">• Role-based RBAC</text>
    </g>
  </g>

  <!-- ── NODE 3: Spring Boot Services ── -->
  <g transform="translate(500,130)" filter="url(#glow)">
    <rect width="220" height="175" rx="14" fill="#071a10" stroke="#166534" stroke-width="1.5"/>
    <rect width="220" height="40" rx="14" fill="#14532d"/>
    <rect y="26" width="220" height="14" fill="#14532d"/>
    <text x="110" y="26" font-family="'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="800" fill="#6db33f" text-anchor="middle">Spring Boot Services</text>
    <g font-family="'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8">
      <text x="16" y="72">• REST Controllers (Auth, Movies…)</text>
      <text x="16" y="95">• Transactional Service Layer</text>
      <text x="16" y="118">• JPA Repositories (Hibernate)</text>
      <text x="16" y="141">• PDF/Excel Export utilities</text>
      <text x="16" y="164">• STOMP Broker (/topic)</text>
    </g>
  </g>

  <!-- ── NODE 4: Database ── -->
  <g transform="translate(772,155)" filter="url(#glow)">
    <rect width="190" height="120" rx="14" fill="#1a0505" stroke="#991b1b" stroke-width="1.5"/>
    <rect width="190" height="38" rx="14" fill="#7f1d1d"/>
    <rect y="24" width="190" height="14" fill="#7f1d1d"/>
    <text x="95" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="800" fill="#f87171" text-anchor="middle">MS SQL Server</text>
    <!-- DB cylinder symbol -->
    <ellipse cx="95" cy="80" rx="42" ry="11" fill="#450a0a" stroke="#991b1b" stroke-width="1.5"/>
    <rect x="53" y="80" width="84" height="28" fill="#450a0a"/>
    <ellipse cx="95" cy="108" rx="42" ry="11" fill="#450a0a" stroke="#991b1b" stroke-width="1.5"/>
    <text x="95" y="98" font-family="'Segoe UI',Roboto,sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">RapPhim DB</text>
  </g>

  <!-- ── HTTP FLOW LINES ── -->
  <!-- Client → Security -->
  <path d="M228 218 L265 218" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowH)"/>
  <rect x="232" y="204" width="26" height="14" rx="4" fill="#1e293b"/>
  <text x="245" y="215" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">HTTPS</text>

  <!-- Security → Services -->
  <path d="M456 218 L495 218" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowH)"/>

  <!-- Services → DB -->
  <path d="M720 218 L767 218" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowH)"/>
  <rect x="726" y="204" width="26" height="14" rx="4" fill="#1e293b"/>
  <text x="739" y="215" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">JPA</text>

  <!-- DB → Services return -->
  <path d="M767 232 L720 232" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowBack)"/>

  <!-- Services → Client return -->
  <path d="M495 232 L228 232" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowBack)"/>

  <!-- ── WEBSOCKET FLOW (curve under boxes) ── -->
  <path d="M228 298 C350 330 550 330 720 298" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowWS)" marker-start="url(#arrowWS)"/>
  <rect x="430" y="318" width="144" height="18" rx="6" fill="#1c1400"/>
  <text x="502" y="331" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="700">WebSocket / STOMP (Realtime)</text>
</svg>
