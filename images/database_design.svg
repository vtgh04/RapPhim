<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 530" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Table Card Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="crow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 M 8 2 L 8 8" fill="none" stroke="#f43f5e" stroke-width="1.5" />
    </marker>
    <marker id="one" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 4 2 L 4 8 M 7 2 L 7 8" fill="none" stroke="#3b82f6" stroke-width="1.5" />
    </marker>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 20px; font-weight: 900; fill: #ffffff; letter-spacing: 1px; }
    .subtitle { font-family: 'Outfit', 'Inter', sans-serif; font-size: 10px; font-weight: 700; fill: #64748b; letter-spacing: 1.5px; }
    
    .table-hdr { font-family: 'Outfit', 'Inter', sans-serif; font-size: 12px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .col-pk { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11px; font-weight: bold; fill: #f43f5e; }
    .col-fk { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11px; font-weight: bold; fill: #3b82f6; }
    .col-std { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11px; fill: #cbd5e1; }
    .col-type { font-family: 'Consolas', 'Fira Code', monospace; font-size: 9px; fill: #64748b; }
    
    .relation-line { fill: none; stroke-width: 1.5; stroke-dasharray: 3 3; transition: all 0.3s; }
  </style>

  <!-- Background -->
  <rect width="1020" height="530" rx="24" fill="url(#bgGrad)" />
  <rect width="1020" height="530" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 45)">
    <text class="subtitle" y="0">SCHEMA DESIGN (3NF)</text>
    <text class="title" y="24">RELATIONAL DATABASE SCHEMA</text>
  </g>

  <!-- Relation Lines -->
  <!-- employees (230, 160) to invoices (290, 160) -->
  <path d="M 230 145 L 290 145" class="relation-line" stroke="#f43f5e" marker-start="url(#one)" marker-end="url(#crow)" />
  
  <!-- invoices (490, 160) to tickets (550, 160) -->
  <path d="M 490 145 L 550 145" class="relation-line" stroke="#f43f5e" marker-start="url(#one)" marker-end="url(#crow)" />

  <!-- movies (230, 380) to showtimes (290, 380) -->
  <path d="M 230 380 L 290 380" class="relation-line" stroke="#f43f5e" marker-start="url(#one)" marker-end="url(#crow)" />

  <!-- showtimes (490, 385) to show_seats (550, 385) -->
  <path d="M 490 385 L 550 385" class="relation-line" stroke="#f43f5e" marker-start="url(#one)" marker-end="url(#crow)" />

  <!-- show_seats (660, 320) to tickets (660, 245) -->
  <path d="M 660 320 L 660 245" class="relation-line" stroke="#3b82f6" marker-start="url(#one)" marker-end="url(#crow)" />

  <!-- cinema_halls (800, 380) to showtimes (490, 410) -->
  <path d="M 800 380 L 770 380 L 770 410 L 490 410" class="relation-line" stroke="#3b82f6" marker-start="url(#one)" marker-end="url(#crow)" />

  <!-- cinema_halls (900, 320) to seats (900, 245) -->
  <path d="M 900 320 L 900 245" class="relation-line" stroke="#f43f5e" marker-start="url(#one)" marker-end="url(#crow)" />


  <!-- ================= TABLES ================= -->

  <!-- Table 1: employees -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="190" height="150" rx="12" fill="url(#tableGrad)" stroke="#334155" stroke-width="1" />
    <path d="M 0 30 L 190 30" stroke="#334155" stroke-width="1" />
    <text class="table-hdr" x="15" y="20">🔑 employees</text>
    
    <text class="col-pk" x="15" y="50">🔑 employee_id <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="70">   full_name   <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="90">   username    <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="110">   password    <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="130">   role        <tspan class="col-type">VARCHAR</tspan></text>
  </g>

  <!-- Table 2: invoices -->
  <g transform="translate(290, 90)" filter="url(#shadow)">
    <rect width="200" height="150" rx="12" fill="url(#tableGrad)" stroke="#334155" stroke-width="1" />
    <path d="M 0 30 L 200 30" stroke="#334155" stroke-width="1" />
    <text class="table-hdr" x="15" y="20">🧾 invoices</text>
    
    <text class="col-pk" x="15" y="50">🔑 invoice_id   <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-fk" x="15" y="70">🔗 employee_id  <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="90">   total_tickets<tspan class="col-type">INT</tspan></text>
    <text class="col-std" x="15" y="110">   total_amount <tspan class="col-type">DECIMAL</tspan></text>
    <text class="col-std" x="15" y="130">   created_at   <tspan class="col-type">DATETIME</tspan></text>
  </g>

  <!-- Table 3: tickets -->
  <g transform="translate(550, 90)" filter="url(#shadow)">
    <rect width="210" height="155" rx="12" fill="url(#tableGrad)" stroke="#334155" stroke-width="1" />
    <path d="M 0 30 L 210 30" stroke="#334155" stroke-width="1" />
    <text class="table-hdr" x="15" y="20">🎟️ tickets</text>
    
    <text class="col-pk" x="15" y="50">🔑 ticket_id    <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-fk" x="15" y="70">🔗 invoice_id   <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-fk" x="15" y="90">🔗 show_seat_id <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="110">   price        <tspan class="col-type">DECIMAL</tspan></text>
    <text class="col-std" x="15" y="130">   code         <tspan class="col-type">VARCHAR</tspan></text>
  </g>

  <!-- Table 4: seats -->
  <g transform="translate(800, 90)" filter="url(#shadow)">
    <rect width="180" height="155" rx="12" fill="url(#tableGrad)" stroke="#334155" stroke-width="1" />
    <path d="M 0 30 L 180 30" stroke="#334155" stroke-width="1" />
    <text class="table-hdr" x="15" y="20">💺 seats</text>
    
    <text class="col-pk" x="15" y="50">🔑 seat_id     <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-fk" x="15" y="70">🔗 hall_id     <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="90">   row_index   <tspan class="col-type">INT</tspan></text>
    <text class="col-std" x="15" y="110">   col_index   <tspan class="col-type">INT</tspan></text>
    <text class="col-std" x="15" y="130">   seat_factor <tspan class="col-type">DOUBLE</tspan></text>
  </g>


  <!-- Table 5: movies -->
  <g transform="translate(40, 320)" filter="url(#shadow)">
    <rect width="190" height="150" rx="12" fill="url(#tableGrad)" stroke="#334155" stroke-width="1" />
    <path d="M 0 30 L 190 30" stroke="#334155" stroke-width="1" />
    <text class="table-hdr" x="15" y="20">🎬 movies</text>
    
    <text class="col-pk" x="15" y="50">🔑 movie_id    <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="70">   title       <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="90">   duration    <tspan class="col-type">INT</tspan></text>
    <text class="col-std" x="15" y="110">   genre       <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="130">   status      <tspan class="col-type">VARCHAR</tspan></text>
  </g>

  <!-- Table 6: showtimes -->
  <g transform="translate(290, 320)" filter="url(#shadow)">
    <rect width="200" height="150" rx="12" fill="url(#tableGrad)" stroke="#334155" stroke-width="1" />
    <path d="M 0 30 L 200 30" stroke="#334155" stroke-width="1" />
    <text class="table-hdr" x="15" y="20">📅 showtimes</text>
    
    <text class="col-pk" x="15" y="50">🔑 showtime_id <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-fk" x="15" y="70">🔗 movie_id    <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-fk" x="15" y="90">🔗 hall_id     <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="110">   start_time  <tspan class="col-type">DATETIME</tspan></text>
    <text class="col-std" x="15" y="130">   base_price  <tspan class="col-type">DECIMAL</tspan></text>
  </g>

  <!-- Table 7: show_seats -->
  <g transform="translate(550, 320)" filter="url(#shadow)">
    <rect width="210" height="150" rx="12" fill="url(#tableGrad)" stroke="#334155" stroke-width="1" />
    <path d="M 0 30 L 210 30" stroke="#334155" stroke-width="1" />
    <text class="table-hdr" x="15" y="20">💺 show_seats</text>
    
    <text class="col-pk" x="15" y="50">🔑 show_seat_id<tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-fk" x="15" y="70">🔗 showtime_id <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-fk" x="15" y="90">🔗 seat_id     <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="110">   price        <tspan class="col-type">DECIMAL</tspan></text>
    <text class="col-std" x="15" y="130">   status       <tspan class="col-type">VARCHAR</tspan></text>
  </g>

  <!-- Table 8: cinema_halls -->
  <g transform="translate(800, 320)" filter="url(#shadow)">
    <rect width="180" height="150" rx="12" fill="url(#tableGrad)" stroke="#334155" stroke-width="1" />
    <path d="M 0 30 L 180 30" stroke="#334155" stroke-width="1" />
    <text class="table-hdr" x="15" y="20">🏢 cinema_halls</text>
    
    <text class="col-pk" x="15" y="50">🔑 hall_id      <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="70">   name         <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="90">   hall_type    <tspan class="col-type">VARCHAR</tspan></text>
    <text class="col-std" x="15" y="110">   total_seats  <tspan class="col-type">INT</tspan></text>
    <text class="col-std" x="15" y="130">   status       <tspan class="col-type">VARCHAR</tspan></text>
  </g>
</svg>
